---
- name: Проверить конфигурацию Nginx
  ansible.builtin.command:
    argv:
      - /usr/sbin/nginx
      - -t
    expand_argument_vars: false
  changed_when: false
  listen: Reload Nginx

- name: Перечитать конфигурацию Nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  listen: Reload Nginx
